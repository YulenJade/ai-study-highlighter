name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - run: docker build -t ai-study-highlighter:test .
  external-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: study_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Start private S3-compatible test store
        run: |
          python -m pip install 'moto[server]>=5.1,<6'
          moto_server -H 127.0.0.1 -p 9000 > /tmp/study-s3-test.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/; then exit 0; fi
            sleep 2
          done
          cat /tmp/study-s3-test.log
          exit 1
      - name: PostgreSQL quota race, S3 persistence, owner isolation and recovery
        env:
          TEST_DATABASE_URL: postgresql+psycopg://study:test-only-password@localhost:5432/study_test
          TEST_S3_ENDPOINT: http://localhost:9000
        run: python -m pytest -q tests/test_library.py
